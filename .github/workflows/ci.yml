name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      REQUIRE_DB: "1" # integration tests fail instead of skipping
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Validate OpenAPI spec and route drift
        run: go test -run 'TestOpenAPI' -v ./internal/httpapi/
      - name: Tests (race detector, coverage)
        run: |
          go test -race -count=1 -covermode=atomic \
            -coverpkg=./internal/...,./migrations/... -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: |
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}')
          echo "Total coverage: $total"
          echo "### Coverage: $total" >> "$GITHUB_STEP_SUMMARY"
      - name: Fuzz (short)
        run: |
          go test ./internal/money -run '^$' -fuzz FuzzParse -fuzztime 10s
          go test ./internal/card -run '^$' -fuzz FuzzLuhn -fuzztime 10s
          go test ./internal/pix -run '^$' -fuzz FuzzParse -fuzztime 10s
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go build
        run: CGO_ENABLED=0 go build -trimpath ./...
      - name: docker build
        run: |
          docker build --target gateway -t simple-payment-gateway:ci .
          docker build --target receiver -t simple-payment-gateway-receiver:ci .
      - name: image runs as non-root
        run: test "$(docker image inspect simple-payment-gateway:ci --format '{{.Config.User}}')" = "nonroot:nonroot"
